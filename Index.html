<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TunnelMotor.net — The End of the SD40T-2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c1c1c;
      --bg-alt: #252525;
      --surface: #2e2e2e;
      --orange: #ff5a00;
      --orange-dim: #cc4800;
      --orange-glow: rgba(255, 90, 0, 0.25);
      --text: #e8e8e8;
      --text-muted: #9a9a9a;
      --border: #3a3a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Speed lettering – SP / Rio Grande inspired */
    .speed {
      font-family: 'Bebas Neue', 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 400;
    }

    .speed-tight {
      letter-spacing: 0.04em;
    }

    a {
      color: var(--orange);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #ff8c40;
    }

    /* Layout */
    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(28, 28, 28, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.65rem;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .logo span {
      color: var(--orange);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .nav-links a:hover {
      color: var(--orange);
    }

    /* Hero */
    .hero {
      padding: 6.5rem 0 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, var(--orange-glow), transparent);
      pointer-events: none;
    }

    .hero-label {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      line-height: 0.95;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero-sub {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 540px;
      margin: 0 auto 2.5rem;
      font-weight: 300;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.85rem 2rem;
      background: var(--orange);
      color: #111;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: #ff7a2e;
      color: #111;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--orange);
      border: 1.5px solid var(--orange);
      margin-left: 0.75rem;
    }

    .btn-outline:hover {
      background: var(--orange);
      color: #111;
    }

    /* Sections */
    section {
      padding: 4.5rem 0;
    }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .section-title span {
      color: var(--orange);
    }

    .section-lead {
      color: var(--text-muted);
      max-width: 620px;
      margin-bottom: 2.75rem;
    }

    /* Cards / Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.75rem;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--orange-dim);
    }

    .card h3 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Feature strip */
    .strip {
      background: var(--bg-alt);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 2rem;
      text-align: center;
    }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      color: var(--orange);
      line-height: 1;
      margin-bottom: 0.35rem;
    }

    .stat-label {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Timeline style */
    .timeline {
      position: relative;
      padding-left: 1.5rem;
      border-left: 2px solid var(--border);
    }

    .timeline-item {
      position: relative;
      padding-bottom: 2.25rem;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -1.65rem;
      top: 0.35rem;
      width: 10px;
      height: 10px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--bg);
    }

    .timeline-year {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 0.35rem;
    }

    .timeline-item h4 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .timeline-item p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* End section */
    .end-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--orange);
      padding: 2.5rem;
      border-radius: 0 4px 4px 0;
    }

    .end-block p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .end-block p:last-child {
      margin-bottom: 0;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 0;
      margin-top: 2rem;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.1em;
    }

    .footer-logo span {
      color: var(--orange);
    }

    .footer-copy {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Utility */
    .mb-0 {
